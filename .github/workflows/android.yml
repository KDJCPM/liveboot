name: Android CI

on:
  # 删除 push 和 pull_request，改为手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
    - uses: actions/checkout@v4
    
    # 1. 将 JDK 版本从 11 升级为 17（JDK 17 是 Android Gradle Plugin 8.0+ 的编译要求）
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 2. 授权 gradlew 执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 3. 编译项目（使用 SDK 34 需要在 build.gradle 中配置 compileSdk 34）
    - name: Build with Gradle
      run: ./gradlew build

    # 4. （可选）上传编译出的 APK 作为 Artifact，方便下载
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
