name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # 添加手动触发选项
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    # 构建Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    
    # 构建Release APK
    - name: Build Release APK
      run: ./gradlew assembleRelease
    
    # 上传APK作为构建产物（仅作为工作流artifact保留）
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-apks
        path: liveBootAni2/build/outputs/apk/**/*.apk
        retention-days: 30  # 可选：设置artifact保留天数，默认90天
