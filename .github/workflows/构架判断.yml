name: 系统架构检查

on:
  push:
  workflow_dispatch:

jobs:
  check-arch:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检查系统信息
        run: |
          echo "=== 系统信息 ==="
          echo "架构: $(uname -m)"
          echo "内核: $(uname -r)"
          echo "系统: $(lsb_release -ds 2>/dev/null || cat /etc/os-release | grep PRETTY_NAME | cut -d= -f2 | tr -d '"')"
          echo ""
          
          echo "=== CPU ==="
          echo "型号: $(lscpu | grep 'Model name' | awk -F: '{print $2}' | xargs)"
          echo "核心数: $(nproc)"
          echo "线程数: $(lscpu | grep 'Thread(s) per core' | awk -F: '{print $2}' | xargs)"
          echo ""
          
          echo "=== 内存 ==="
          echo "总量: $(free -h | awk '/^Mem:/ {print $2}')"
          echo "可用: $(free -h | awk '/^Mem:/ {print $7}')"
          echo ""
          
          echo "=== 存储 ==="
          df -h / | awk 'NR==2 {print "总量: " $2 "  已用: " $3 "  可用: " $4 "  使用率: " $5}'
          echo ""
          
          echo "=== GPU ==="
          if command -v nvidia-smi &> /dev/null; then
            nvidia-smi --query-gpu=name,memory.total --format=csv,noheader | head -1 | awk '{print "型号: " $0}'
          else
            echo "未检测到 NVIDIA GPU"
          fi
          echo ""
          
          echo "=== 网络 ==="
          echo "IP 地址: $(hostname -I | awk '{print $1}')"
