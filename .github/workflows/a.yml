name: Build SteamOS for sheng (Steam Frame base)

# 用 Steam Frame 官方镜像作底包，把 Frame 的 rootfs 原样铺进一个 ext4 镜像，
# 直接上传 rootfs.img 作为工作流产物。不做任何注入/裁剪/改写，保证内容与原镜像一致。
on:
  workflow_dispatch:
    inputs:
      frame_image_url:
        description: '底包地址（Steam Frame 官方恢复镜像，公开可直连）'
        required: true
        type: string
        default: 'https://steamdeck-images.steamos.cloud/recovery/steamframe-repair-latest.img.bz2'
      rootfs_size:
        description: 'rootfs.img 初始大小（下限；脚本会按底包实际用量自动放大）'
        required: false
        type: string
        default: '14G'
      upload_artifacts:
        description: '上传 rootfs.img（关掉只做构建校验，不产出可下载产物）'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    name: Assemble SteamOS-for-sheng RootFS (raw Frame userspace)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      WORK: /mnt/frame-work
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space (Frame 底包 + 目标镜像要同时存在)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h / | tail -1

      - name: Install Host Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl bzip2 zstd xz-utils e2fsprogs rsync util-linux btrfs-progs

      - name: Fetch Frame base (download → bz2 → GPT p2 切出 rootfs 分区)
        run: |
          chmod +x scripts/host/00-fetch-frame-rootfs.sh
          sudo env FRAME_IMAGE_URL="${{ inputs.frame_image_url }}" WORK="$WORK" OUT="$WORK/out" \
            bash scripts/host/00-fetch-frame-rootfs.sh

      - name: Lay Frame userspace into our ext4 image
        run: |
          chmod +x scripts/host/01-lay-rootfs.sh
          sudo bash scripts/host/01-lay-rootfs.sh "$WORK/out/rootfs.frame" rootfs.img "${{ inputs.rootfs_size }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## SteamOS for sheng 构建结果（原样铺盘，无注入）"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 底包 | Steam Frame 官方镜像 |"
            echo "| rootfs.img | $(du -h rootfs.img 2>/dev/null | cut -f1 || echo N/A) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RootFS Image
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: steamos-sheng-rootfs
          path: rootfs.img
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
