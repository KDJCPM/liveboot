name: Extract and Convert Btrfs to Ext4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip btrfs-progs e2fsprogs util-linux rsync

      - name: Download image
        run: |
          wget -O image.zip \
            "https://steamdeck-images.steamos.cloud/recovery/steamframe-oobe-repair-20260922.5153644-0.3.0.img.zip"

      - name: Unzip to get lun0.img
        run: |
          unzip -o image.zip
          ls -lh

      - name: Extract rootfs-A.img with dd
        run: |
          dd if=lun0.img of=rootfs-A.img bs=512 skip=655394 count=10485760 status=progress

      - name: Restore btrfs to directory
        run: |
          # 用 btrfs restore 直接把 btrfs 镜像内容解包到普通目录
          # 不需要 root，不需要 loop mount，不需要分区表
          mkdir -p rootfs-A-out
          sudo btrfs restore -vi rootfs-A.img rootfs-A-out

      - name: Check restored contents
        run: |
          sudo ls -lah rootfs-A-out | head -50
          sudo du -sh rootfs-A-out

      - name: Build ext4 image from restored tree
        run: |
          # 按解包出来的实际大小估算 ext4 镜像大小（多留 1G 余量）
          SIZE_MB=$(sudo du -sm rootfs-A-out | awk '{print $1}')
          IMG_MB=$((SIZE_MB + 1024))
          echo "Restored size: ${SIZE_MB} MB, ext4 image size: ${IMG_MB} MB"

          sudo dd if=/dev/zero of=rootfs-A-ext4.img bs=1M count=${IMG_MB} status=progress
          sudo mkfs.ext4 -F -L rootfs-A rootfs-A-ext4.img

          sudo mkdir -p /mnt/ext4
          sudo mount -o loop rootfs-A-ext4.img /mnt/ext4

          # 保留权限、符号链接、xattr、硬链接
          sudo rsync -aAXH --info=progress2 rootfs-A-out/ /mnt/ext4/

          sudo umount /mnt/ext4

      - name: Compress output
        run: |
          zip -9 rootfs-A-ext4.img.zip rootfs-A-ext4.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-A-ext4
          path: rootfs-A-ext4.img.zip
          retention-days: 7
